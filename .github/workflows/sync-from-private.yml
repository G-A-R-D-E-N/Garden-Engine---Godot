name: Sync from private

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-from-private
  cancel-in-progress: false

jobs:
  sync:
    name: Export private pull requests and branches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Constraint: the garden-engine-ci environment's deployment branches must allow main, not only ci/**.
    environment: garden-engine-ci
    steps:
      - name: Fetch the sync script from the first integration branch that has it
        env:
          TOKEN: ${{ secrets.GE_PUBLIC_CI_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          mkdir private && cd private
          git init --quiet .
          git remote add origin https://github.com/G-A-R-D-E-N/Garden-Engine.git
          for branch in nomad/dev darkstar/dev; do
            git fetch --quiet --no-tags --depth=1 origin "refs/heads/$branch" >/dev/null 2>&1 || continue
            git cat-file -e FETCH_HEAD:.github/public-ci/sync-from-private.py 2>/dev/null || continue
            git cat-file -e FETCH_HEAD:.github/public-ci/export-public-ci.py 2>/dev/null || continue
            git checkout --quiet --detach FETCH_HEAD >/dev/null 2>&1 || { echo "::error::cannot check out $branch"; exit 1; }
            echo "Using the sync script from $branch"
            exit 0
          done
          echo "::error::neither nomad/dev nor darkstar/dev can be read with the sync script"
          exit 1

      - name: Export, check and report
        env:
          TOKEN: ${{ secrets.GE_PUBLIC_CI_TOKEN }}
        run: python3 -I -B private/.github/public-ci/sync-from-private.py
